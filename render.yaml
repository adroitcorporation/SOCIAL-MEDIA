# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: founder-circle
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: NODE_ENV
        value: production
      - key: LOCAL_DEMO
        value: 'false'
      - key: DATABASE_URL
        fromDatabase:
          name: founder-circle-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
databases:
  - name: founder-circle-db
    databaseName: founder_circle
    region: singapore
    plan: free
    ipAllowList: []
