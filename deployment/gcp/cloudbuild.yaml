# Manual build only; no production trigger. Public build substitutions only.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - runtime
      - -f
      - deployment/gcp/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=$PROJECT_ID
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_PUBLIC_AUTH_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_PUBLIC_APP_ID}
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_FRONTEND_ORIGIN}
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/cynk/backend:${_RELEASE}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - tooling
      - -f
      - deployment/gcp/Dockerfile
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=$PROJECT_ID
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_API_KEY=${_PUBLIC_AUTH_KEY}
      - --build-arg
      - NEXT_PUBLIC_FIREBASE_APP_ID=${_PUBLIC_APP_ID}
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_FRONTEND_ORIGIN}
      - -t
      - asia-south1-docker.pkg.dev/$PROJECT_ID/cynk/tooling:${_RELEASE}
      - .
images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/cynk/backend:${_RELEASE}
  - asia-south1-docker.pkg.dev/$PROJECT_ID/cynk/tooling:${_RELEASE}
substitutions:
  _RELEASE: reviewed-commit
  _PUBLIC_AUTH_KEY: SET_PUBLIC_WEB_API_KEY
  _PUBLIC_APP_ID: SET_PUBLIC_WEB_APP_ID
  _FRONTEND_ORIGIN: https://SET_STAGING_FRONTEND.vercel.app
