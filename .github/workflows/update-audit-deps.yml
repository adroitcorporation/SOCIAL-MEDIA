name: Audit dependency lockfile update
on:
  push:
    branches:
      - audit/2026-10-07-hardening
    paths:
      - .github/workflows/update-audit-deps.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Update only vulnerable production dependencies
        run: |
          npm install --save-exact next@16.4.0 sharp@0.35.5
          npm audit fix --package-lock-only
      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: update vulnerable production dependencies"
          git push origin HEAD:${GITHUB_REF_NAME}
