name: Verify Founder Circle
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npx playwright install --with-deps chromium
      - name: Start isolated local demo
        run: |
          npm run db:local > /tmp/circle-db.log 2>&1 &
          for i in $(seq 1 30); do
            if grep -q 'listening on' /tmp/circle-db.log; then break; fi
            sleep 1
          done
          npm run demo > /tmp/circle-app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/circle-db.log /tmp/circle-app.log
          exit 1
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
